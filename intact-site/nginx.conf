# Static server for the built Astro site. Listens on 8080 (Fly's internal_port).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache HTML — content can change on each deploy.
    location = / {
        try_files /index.html =404;
    }

    # Content-hashed, immutable build assets — cache aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Astro emits directory-style routes (/evidence/index.html). Serve the
    # directory index for both /evidence and /evidence/; fall through to 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/xml+rss;
}
